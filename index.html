<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUANTOOLS</title>
    <link rel="stylesheet" href="style.css">
</head>
<script src="http://192.168.0.9:3000/socket.io/socket.io.js"></script>
<script src="script.js"></script>
<body>

    <header>
        <h1>JUANTOOLS</h1>
        <p>Herramientas simples para todos.</p>
    </header>

    <main>

        <button onclick="alternarFuncion('calculadora')">
            🧮 Calculadora
        </button>
        <button onclick="alternarFuncion('notas')">
    📝 Bloc de notas
</button>
        <button onclick="alternarFuncion('cronometro')">
    ⏱️ Cronómetro
</button>

<button onclick="alternarFuncion('cuentas')">
    👤 Cuenta
</button>

<button onclick="alternarFuncion('juantssapp')">
    💬 JUANTSSAPP
</button>

<section id="cronometro" class="oculto">
    <h2>Cronómetro</h2>

    <div id="tiempo">00:00:00</div>

    <button onclick="iniciarCronometro()">▶️ Iniciar</button>

    <button onclick="pausarCronometro()">⏸️ Pausar</button>

    <button onclick="reiniciarCronometro()">🔄 Reiniciar</button>

</section>
<section id="notas" class="oculto">

    <h2>Bloc de notas</h2>

    <textarea
        id="textoNotas"
        placeholder="Escribe aquí..."
    ></textarea>

    <button onclick="guardarNotas()">
        💾 Guardar
    </button>

    <button onclick="borrarNotas()">
        🗑️ Borrar
    </button>

    <p id="estadoNotas">Sin cambios</p>

</section>
        </button>

        <section id="calculadora" class="oculto">

            <h2>Calculadora</h2>

            <input
                type="number"
                id="numero1"
                placeholder="Primer número"
            >

            <input
                type="number"
                id="numero2"
                placeholder="Segundo número"
            >

            <div class="operaciones">
                <button onclick="calcular('+')">+</button>
                <button onclick="calcular('-')">−</button>
                <button onclick="calcular('*')">×</button>
                <button onclick="calcular('/')">÷</button>
            </div>

            <h3 id="resultado">Resultado: --</h3>

        </section>

    <img id="fotoPerfil" src="" alt="Foto de perfil" style="width:100px;height:100px;border-radius:50%;object-fit:cover;display:none;">

    <input type="file" id="selectorFoto" accept="image/*" onchange="cambiarFotoPerfil(event)">
<section id="cuentas" class="oculto">

    <h2>🔐 Cuenta</h2>

    <input type="text" id="usuario" placeholder="Nombre de usuario">
    <p id="etiquetaUsuario"></p>

    <input type="password" id="contrasena" placeholder="Contraseña">
    <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>

    <button onclick="iniciarSesion()">🔓 Iniciar sesión</button>

    <button onclick="registrarse()">📝 Crear cuenta</button>

    <p id="estadoCuenta">Sin sesión</p>

</section>
<section id="juantssapp" class="oculto">

    <div class="juantssapp-header">
        <h2>💬 JUANTSSAPP</h2>
        <input
            type="text"
            id="buscarAmigos"
            placeholder="🔎 Buscar amigos..."
            oninput="buscarAmigos()"
        >
    </div>

    <div id="resultadosBusqueda"></div>
    <div id="listaAmigos">
    </div>

    <div id="pantallaChat" class="oculto">

        <button onclick="volverAmigos()">← Amigos</button>

        <h2 id="nombreChat">Chat</h2>
<button onclick="mostrarPerfilContacto()">
    👤 Ver perfil
</button>

<div id="perfilContacto" class="oculto">

    <div id="avatarPerfilContacto">👤</div>

    <h2 id="nombrePerfilContacto">Contacto</h2>

    <p id="estadoPerfilContacto">🟢 En línea</p>

    <button onclick="cerrarPerfilContacto()">
        ← Volver al chat
    </button>

</div>
        <div id="mensajes"></div>

        <div class="entradaMensaje">

            <input
                type="text"
                id="mensajeInput"
                placeholder="Escribe un mensaje..."
            >

            <button onclick="enviarMensaje()">📤</button>

        </div>

    </div>

    <button
        class="volverInicio"
        onclick="alternarFuncion('juantssapp')"
    >
        🏠 Volver a la pantalla de inicio
    </button>

</section>


<script>
restaurarSesion();
</script>
